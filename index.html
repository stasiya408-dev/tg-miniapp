<script>
// Підключення до Telegram Mini App
try {
  const tg = window.Telegram && Telegram.WebApp;
  if (tg) {
    tg.ready(); tg.expand();
    try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
    try { tg.setHeaderColor('#0c0a10'); tg.setBackgroundColor('#0c0a10'); } catch (e) {}
    window.TG = tg; // tg.initDataUnsafe.user: id, first_name, username
  }
} catch (e) {}
</script>
<title>Потужне Місто прототип</title>
<style>
:root{--bg:#d9d9d9;--panel:#f4f4f4;--line:#555;--ink:#111;--acc:#ffd84a;--ok:#9be39b;--bad:#f3a3a3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#d9d9d9}}
:root[data-theme="dark"]{--bg:#d9d9d9}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#888;font:13px/1.3 system-ui,Arial,sans-serif;color:var(--ink)}
#phone{position:relative;margin:0 auto;height:100%;width:min(100%,56.25vh);background:var(--bg);overflow:hidden;display:flex;flex-direction:column;border-left:1px solid #000;border-right:1px solid #000}
#app{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px;position:relative}
button{font:inherit;border:1px solid var(--line);background:#fff;padding:5px 7px;border-radius:3px;cursor:pointer;color:var(--ink)}
button:active{background:#ccc}
button.y{background:var(--acc);font-weight:bold}
button.g{background:var(--ok)}
button.dis,button:disabled{opacity:.45}
button.sel{background:#333;color:#fff}
.bar{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.bar.sp{justify-content:space-between}
.box{border:1px solid var(--line);background:var(--panel);padding:6px;margin:5px 0;border-radius:3px}
.row{display:flex;gap:6px;align-items:center;border:1px solid #999;background:#fff;padding:5px;margin:4px 0;border-radius:3px}
.row .f{flex:1;min-width:0}
.tabs{display:flex;gap:2px;margin:5px 0}
.tabs button{flex:1;padding:6px 2px;font-size:12px}
.grid{display:grid;gap:4px}
.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.cell{border:1px solid #999;background:#fff;padding:4px;text-align:center;border-radius:3px;font-size:11px;position:relative}
.cell img{max-width:100%;height:48px;object-fit:contain;display:block;margin:0 auto}
h2{margin:4px 0;font-size:17px;text-align:center}
h3{margin:4px 0;font-size:14px}
.top{display:flex;gap:4px;align-items:center;background:#bbb;padding:4px;border-bottom:1px solid #000;font-size:12px;flex-wrap:wrap}
.cur{border:1px solid #555;background:#fff;padding:2px 5px;border-radius:10px;white-space:nowrap}
.small{font-size:11px;color:#444}
.prog{height:8px;background:#fff;border:1px solid #555;border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:#4a4}
.r0{border-color:#888}.r1{border-color:#2a2;box-shadow:inset 0 0 0 2px #2a2}.r2{border-color:#26c;box-shadow:inset 0 0 0 2px #26c}.r3{border-color:#93c;box-shadow:inset 0 0 0 2px #93c}.r4{border-color:#d90;box-shadow:inset 0 0 0 2px #d90}
.badge{position:absolute;top:-5px;right:-5px;background:red;color:#fff;border-radius:9px;font-size:9px;min-width:14px;height:14px;line-height:14px;text-align:center;padding:0 3px;box-shadow:0 0 0 2px #fff;z-index:2}
.side{display:flex;flex-direction:column;gap:6px}
.side button{position:relative;width:74px}
#toast{position:absolute;left:8px;right:8px;bottom:70px;z-index:50;display:flex;flex-direction:column;gap:4px;pointer-events:none}
#toast div{background:#222;color:#fff;padding:6px 8px;border-radius:4px;opacity:.95}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none;align-items:center;justify-content:center;padding:14px}
#modal .in{background:#fff;border:2px solid #000;padding:10px;width:100%;max-height:90%;overflow:auto;border-radius:4px}
.navb{display:flex;border-top:1px solid #000;background:#bbb}
.navb button{flex:1;border-radius:0;padding:9px 1px;font-size:11px}
.doll{position:relative;margin:0 auto}
.doll img{position:absolute;pointer-events:none}
.card{display:inline-block;border:1px solid #333;background:#fff;width:30px;height:42px;line-height:40px;text-align:center;border-radius:3px;font-weight:bold;margin:1px}
.card.red{color:#c00}.card.back{background:repeating-linear-gradient(45deg,#a33,#a33 4px,#c55 4px,#c55 8px)}
.reel{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;background:#333;padding:4px;border-radius:4px}
.reel div{background:#fff;text-align:center;font-size:24px;height:46px;line-height:46px;border-radius:3px}
.reel div.win{background:var(--acc)}
canvas{width:100%;background:#fff;border:1px solid #999;display:block}
.map{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.map .cell{height:52px;display:flex;flex-direction:column;justify-content:center}
.done{background:#cfc!important}.cur-st{background:var(--acc)!important}.lock{background:#ddd!important;color:#777}
input,select{font:inherit;padding:5px;border:1px solid #555;border-radius:3px;max-width:100%}
.note{font-size:10px;color:#666;font-style:italic}
.winner{border:3px solid #f5b800!important;background:#fff6cc!important;box-shadow:0 0 12px 3px #f5b800;animation:pulse 1s infinite alternate}
.crown{background:#f5b800;color:#000;font-weight:bold;font-size:11px;border-radius:3px;margin-bottom:2px}
.winban{text-align:center;font-weight:bold;font-size:16px;padding:10px;margin:5px 0;border-radius:4px;background:#f5b800;border:2px solid #000;animation:pulse 1s infinite alternate}
.winban.me{background:#3c3;color:#fff}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.03)}}
@media (prefers-reduced-motion: reduce){.winner,.winban{animation:none}}

/* неон-стиль */
.top{background:linear-gradient(#1b1320,#0c0a10);border-bottom:1px solid #c9a24a;color:#fff;padding:5px 4px;gap:4px;flex-wrap:nowrap;overflow:hidden}
.cur{background:linear-gradient(#2a2230,#120e16);border:1.5px solid #c9a24a;color:#fff;border-radius:14px;padding:3px 6px;font-size:11px;font-weight:bold;box-shadow:0 1px 3px #000}
.top button{background:linear-gradient(#2a2230,#120e16);border:1.5px solid #c9a24a;color:#fff;border-radius:8px}
.side button{background:linear-gradient(#2d2530,#14101a);border:1.5px solid #d8b25a;color:#fff;border-radius:9px;font-weight:bold;font-size:12px;padding:9px 4px;box-shadow:0 2px 5px rgba(0,0,0,.6)}
.side button.y{background:linear-gradient(#ffd84d,#f0a91a);color:#1a1200;border-color:#fff2b0}
button.play{background:linear-gradient(#ffd84d,#f0a91a)!important;color:#1a1200;border:2px solid #fff2b0!important;border-radius:12px!important;font-weight:900;letter-spacing:1px;box-shadow:0 3px 10px rgba(0,0,0,.6)}
.navb{background:linear-gradient(#1b1320,#0c0a10);border-top:1px solid #c9a24a;gap:4px;padding:4px}
.navb button{background:linear-gradient(#f4efe6,#d9d2c4);color:#1a1200;border:1.5px solid #c9a24a;border-radius:8px;font-weight:bold;padding:6px 1px 7px;line-height:1.1}
.navb button .ic{display:block;font-size:20px;margin-bottom:2px}
.navb button.sel{background:linear-gradient(#ffd84d,#f0a91a);color:#1a1200}
.ico{display:inline-block;width:34px;height:34px;vertical-align:middle;object-fit:contain;margin-right:6px;font-size:26px;line-height:34px;text-align:center}
.row .ico{float:left;margin-top:2px}
.cell img.ico,.cell .ico{display:block;margin:0 auto 2px;float:none;height:44px;width:44px;font-size:34px;line-height:44px}
button .ico{display:block;margin:0 auto 2px;float:none}
.fside{width:60px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;overflow-x:hidden}
.fside button,.fside label{width:100%;padding:4px 1px;font-size:11px;line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #888;border-radius:4px;background:#fff;cursor:pointer;text-align:center;min-height:42px}
.fside button.sel{background:#333;color:#fff}.fside button.y{background:var(--acc)}
.fside label.selL{background:#ffd84d;border-color:#c9a24a}.fside label input{margin:0 0 2px}
.fside span{font-size:9px;display:block}
.fico{width:34px;height:34px;object-fit:contain;display:block}
.side{gap:5px}.side button{width:62px!important;font-size:11px!important;padding:7px 2px!important;line-height:1.15;background:linear-gradient(rgba(35,26,40,.82),rgba(14,10,20,.82))}.side button.y{background:linear-gradient(#ffd84d,#f0a91a)!important}
.navb button{padding:5px 1px 6px}.navb button .ic{font-size:18px}
.top{gap:3px!important;padding:4px 3px!important}.top .cur{font-size:10px!important;padding:3px 4px!important;flex:0 1 auto;min-width:0;white-space:nowrap}.top .cur .nm{display:inline-block;max-width:46px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}.top>button{padding:3px 6px!important;flex:0 0 auto;font-size:13px}
.reel div.spin{filter:blur(1.6px);background:linear-gradient(#fff,#e8e8e8 50%,#fff);transform:scaleY(1.08)}.reel div.stop{animation:rstop .22s ease-out}@keyframes rstop{0%{transform:translateY(-10px)}60%{transform:translateY(3px)}100%{transform:none}}
.tabs{display:flex;gap:3px;align-items:stretch}
.tabs button{flex:1 1 0;min-width:0;min-height:36px;padding:4px 2px;font-size:11.5px;line-height:1.1;display:flex;align-items:center;justify-content:center;text-align:center;overflow-wrap:anywhere;white-space:normal}
.navb button{flex:1 1 0;min-width:0}
.top .cur{flex:1 1 0!important;text-align:center;overflow:hidden;text-overflow:ellipsis}.top .cur:first-of-type{flex:1.3 1 0!important}
.reel div.scat,.scatT{background:linear-gradient(#fff3b0,#ffb81c);box-shadow:inset 0 0 0 2px #b36b00;position:relative}
.reel div.scat{line-height:34px!important;font-size:22px!important}
.scatT{display:inline-block;width:34px;height:40px;line-height:28px;font-size:20px;text-align:center;border-radius:4px;margin-right:2px;color:#000}
.reel div.scat::after,.scatT::after{content:'BONUS';position:absolute;left:0;right:0;bottom:2px;font-size:8px;font-weight:900;line-height:1;color:#7a3b00;letter-spacing:.3px}
.reel div.scat.win{animation:scp .5s infinite alternate}@keyframes scp{to{box-shadow:inset 0 0 0 3px #fff,0 0 10px 2px #ffd400;transform:scale(1.07)}}
</style>

  <div id="topbar"></div>
  <div id="app"></div>

</div>
